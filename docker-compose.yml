services:
  db:
    image: postgres:17-alpine
    container_name: product-db
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: products
      POSTGRES_PASSWORD: products
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U products -d products" ]
      interval: 2s
      timeout: 3s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/products
      DB_USER: products
      DB_PASSWORD: products
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  benchmark:
    build:
      context: .
      dockerfile: Dockerfile.benchmark
    container_name: product-benchmark
    depends_on:
      - app
    command: sh -c "chmod +x /app/benchmark.sh && /app/benchmark.sh"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  k6:
    image: grafana/k6:1.0.0
    container_name: product-k6
    profiles: [ "k6" ]
    depends_on:
      - app
    volumes:
      - ./perf/k6:/scripts:ro,z
    command: run /scripts/load-test.js
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
